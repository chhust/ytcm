[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytcm"
version = "0.1.0"
description = "YouTube Comment Miner"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Christoph Hust" },
    { name = "Natasha Niaz" }
]
keywords = ["youtube", "comments", "musicology", "digital musicology"]

requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.195.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.9.4",
    "networkx>=3.2.1",
    "pandas>=2.3.3",
    "python-dateutil>=2.8.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "textblob>=0.19.0",
    "tqdm>=4.67.3",
    "vadersentiment>=3.3.2",
    "wordcloud>=1.9.6",
    "cryptography>=50.0.1",
    "httplib2>=0.32.0",
    "idna>=3.19",
    "nltk>=3.10.3",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "urllib3>=2.8.0"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta"
]

[project.urls]

Homepage = "https://github.com/chhust/ytcm"
Issues = "https://github.com/chhust/ytcm/issues"

[project.scripts]

ytcm = "YTCM:main"

[tool.setuptools]
package-dir = { "ytcm" = "src/ytcm" }
packages = ["ytcm"]
py-modules = ["YTCM"]

[project.optional-dependencies]
dev = ["coverage>=7.6"]
